#--------------------------------------------------------------------------------
# WATCHTOWER - GRAFANA CONFIGURATION
# Grafana documentation: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
#--------------------------------------------------------------------------------


#--------------------------------------------------------------------------------
# PATHS
# Defines where Grafana stores data, logs, and plugins
#--------------------------------------------------------------------------------
[paths]
data         = /var/lib/grafana
logs         = /var/log/grafana
plugins      = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning


#--------------------------------------------------------------------------------
# SERVER
# Network and URL configuration
# When adding a reverse proxy, update protocol to https and set cert paths
#--------------------------------------------------------------------------------
[server]
instance_name = watchtower-dashboard
protocol      = http
http_addr     = 0.0.0.0
http_port     = 3000
domain        = localhost
root_url      = %(protocol)s://%(domain)s:%(http_port)s/

# Uncomment and set these when you add TLS/reverse proxy
# protocol    = https
# cert_file   = /etc/grafana/certs/grafana.crt
# cert_key    = /etc/grafana/certs/grafana.key


#--------------------------------------------------------------------------------
# DATABASE
# Grafana's internal database for storing dashboards, users, and config
# Default is SQLite — fine for a homelab single-node setup
#--------------------------------------------------------------------------------
[database]
type = sqlite3
path = grafana.db

# Uncomment to use your TimescaleDB/PostgreSQL instance for Grafana internals
# (separate from your metrics data — only recommended if you outgrow SQLite)
# type     = postgres
# host     = db:5432
# name     = grafana
# user     = grafana
# password = CHANGEME
# ssl_mode = disable


#--------------------------------------------------------------------------------
# SECURITY
# Hardens the Grafana instance against common web vulnerabilities
#--------------------------------------------------------------------------------
[security]
# Change this to a long random string — used to sign cookies and tokens
# Generate one with: openssl rand -hex 32
secret_key             = CHANGEME_USE_LONG_RANDOM_STRING

disable_gravatar       = true
cookie_secure          = false
# Set cookie_secure = true when you add HTTPS/reverse proxy

cookie_samesite        = lax
allow_embedding        = false
x_content_type_options = true
x_xss_protection       = true

# Prevent Grafana from using default admin credentials silently
# Change these immediately on first run
admin_user             = admin
admin_password         = CHANGEME


#--------------------------------------------------------------------------------
# USERS
# Controls user signup, roles, and UI defaults
#--------------------------------------------------------------------------------
[users]
allow_sign_up    = false
default_theme    = dark
viewers_can_edit = false
auto_assign_org_role = Viewer


#--------------------------------------------------------------------------------
# AUTH
# Authentication settings
# Default is username/password — extend later with OAuth/SSO if desired
#--------------------------------------------------------------------------------
[auth]
disable_login_form   = false
disable_signout_menu = false

[auth.anonymous]
enabled = false


#--------------------------------------------------------------------------------
# RATE LIMITING
# Protects the login endpoint from brute force attacks
#--------------------------------------------------------------------------------
[security.login]
maximum_inactive_lifetime_duration = 7d
maximum_lifetime_duration          = 30d

[auth.ratelimit]
enabled   = true
limit     = 5
burst     = 10


#--------------------------------------------------------------------------------
# SESSION
#--------------------------------------------------------------------------------
[session]
provider      = file
provider_config = sessions
cookie_secure = false
# Set cookie_secure = true when HTTPS is configured
session_life_time = 86400


#--------------------------------------------------------------------------------
# ANALYTICS
# Disable all telemetry back to Grafana Labs
#--------------------------------------------------------------------------------
[analytics]
reporting_enabled  = false
check_for_updates  = false
feedback_links_enabled = false


#--------------------------------------------------------------------------------
# LOGGING
# Console mode is correct for Docker — logs pipe to stdout/stderr
# Collected by Docker log driver
#--------------------------------------------------------------------------------
[log]
mode  = console
level = info

[log.console]
format = json


#--------------------------------------------------------------------------------
# ALERTING
# Built-in Grafana alerting — enable when you are ready to configure alerts
#--------------------------------------------------------------------------------
[alerting]
enabled = false

[unified_alerting]
enabled = true


#------------------------------------------------------------------------------
# DASHBOARDS
# Controls default dashboard behavior
#-------------------------------------------------------------------------------
[dashboards]
min_refresh_interval = 10s
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/home.json
