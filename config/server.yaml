server:
  host: "0.0.0.0"
  port: 443
  secret: "CHANGEME"
  verbose: true
tls:
  ca_cert: "/opt/watchtower/tls/ca/ca.crt"
  server_cert: "/opt/watchtower/tls/server/server.crt"
  server_key: "/opt/watchtower/tls/server/server.key"
database:
  host: "localhost"
  port: 5432
  name: "watchtower"
  user: "watchtower"
  password: "CHANGEME"
  ssl_mode: "disable"
scanner:
  enabled: true
  interval_minutes: 10
  max_concurrent_scans: 25
alerts:
  discord:
    enabled: false
    webhook_url: ""
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    from: ""
    to: ""