services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: watchtower_db
    restart: always
    environment:
      POSTGRES_USER: "watchtower"
      POSTGRES_PASSWORD: "CHANGEME"
      POSTGRES_DB: "watchtower"
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - watchtower_db_volume:/var/lib/postgresql/data
    
volumes:
  watchtower_db_volume: